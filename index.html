<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#090B10" />
    <meta name="description" content="BINANCE REWARD BOT — Telegram Mini App" />
    <title>BINANCE REWARD BOT</title>
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />

    <!-- Telegram Mini App SDK (must load before the app module) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Critical loading-screen styles (inline so the first paint is branded) -->
    <style>
      :root {
        --bg: #090b10;
        --gold: #f0b90b;
        --gold-soft: #d9ad45;
        --text: #f5f5f5;
        --muted: #a0a4ad;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }
      #loading-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: var(--bg);
        z-index: 9999;
      }
      #loading-screen .brand-mark {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: linear-gradient(135deg, var(--gold), var(--gold-soft));
        color: #090b10;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -1px;
        box-shadow: 0 8px 24px rgba(240, 185, 11, 0.25);
      }
      #loading-screen h1 {
        font-size: 1rem;
        letter-spacing: 2px;
        font-weight: 700;
        color: var(--gold);
        margin: 0;
      }
      #loading-screen p {
        font-size: 0.85rem;
        color: var(--muted);
        margin: 0;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(240, 185, 11, 0.15);
        border-top-color: var(--gold);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="loading-screen">
        <div class="brand-mark">B</div>
        <h1>BINANCE REWARD BOT</h1>
        <p id="loading-text">Initializing secure session…</p>
        <div class="spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
